name: Check for new Lampac image

on:
  schedule:
    # каждый день в 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Get latest digest from GHCR
        id: digest
        run: |
          DIGEST=$(skopeo inspect --no-tags docker://ghcr.io/lampac-nextgen/lampac:latest | jq -r '.Digest')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Compare with last known digest
        id: compare
        run: |
          LAST_FILE=".github/last-digest.txt"
          NEW="${{ steps.digest.outputs.digest }}"
          if [ -f "$LAST_FILE" ] && [ "$(cat "$LAST_FILE")" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump add-on version
        if: steps.compare.outputs.changed == 'true'
        run: |
          NEW_VERSION="$(date -u +%Y.%m.%d)"
          # если сегодня уже бампали (несколько релизов за день) — добавляем суффикс
          if grep -q "version: \"$NEW_VERSION\"" lampac/config.yaml; then
            NEW_VERSION="${NEW_VERSION}.$(date -u +%H%M)"
          fi
          sed -i "s/^version: .*/version: \"$NEW_VERSION\"/" lampac/config.yaml
          echo "${{ steps.digest.outputs.digest }}" > .github/last-digest.txt
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Commit and push
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lampac/config.yaml .github/last-digest.txt
          git commit -m "Lampac image updated -> bump add-on version to ${NEW_VERSION}"
          git push
