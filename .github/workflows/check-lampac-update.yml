name: Build and version Lampac add-on

# Единая точка, где назначается версия аддона (формат ГГГГ.ММ.ДД, при
# нескольких сборках за день — ГГГГ.ММ.ДД.ЧЧММ). Версию руками в
# lampac/config.yaml не меняем — её всегда ставит этот workflow, поэтому
# формат одинаковый во всех копиях репозитория.
#
# Когда запускается:
#   - каждый день в 05:00 UTC — если вышел новый образ Lampac на GHCR;
#   - при push в main с изменениями в lampac/ — после правок аддона/модулей;
#   - вручную (Actions → Run workflow), с опцией принудительного бампа;
#   - в pull request с изменениями в lampac/ — только сборка и smoke test, без бампа.
#
# Версия бампается только если тестовая сборка образа прошла и Lampac
# поднялся вместе с модулями из lampac/mods.

on:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches: [main]
    paths:
      - "lampac/**"
      - ".github/workflows/check-lampac-update.yml"
  pull_request:
    branches: [main]
    paths:
      - "lampac/**"
      - ".github/workflows/check-lampac-update.yml"
  workflow_dispatch:
    inputs:
      force_bump:
        description: "Поднять версию даже без изменений"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: addon-version
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      bump: ${{ steps.decide.outputs.bump }}
    steps:
      - uses: actions/checkout@v4

      - name: Get latest Lampac digest from GHCR
        id: digest
        run: |
          command -v skopeo >/dev/null || (sudo apt-get update && sudo apt-get install -y skopeo)
          DIGEST=$(skopeo inspect --no-tags docker://ghcr.io/lampac-nextgen/lampac:latest | jq -r '.Digest')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Upstream digest: $DIGEST"

      - name: Decide whether to bump
        id: decide
        run: |
          LAST=""
          [ -f .github/last-digest.txt ] && LAST="$(cat .github/last-digest.txt)"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.force_bump }}" = "true" ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          elif [ "$LAST" != "${{ steps.digest.outputs.digest }}" ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "Образ Lampac не изменился — сборка и бамп не нужны."
          fi

      - name: Build add-on image (amd64)
        if: steps.decide.outputs.bump == 'true'
        run: docker build --pull -t lampac-addon:ci lampac/

      - name: Smoke test (Lampac + модули из lampac/mods)
        if: steps.decide.outputs.bump == 'true'
        run: |
          mkdir -p ci-data
          python3 - <<'EOF'
          import json, yaml
          opts = yaml.safe_load(open("lampac/config.yaml"))["options"]
          opts["root_password"] = "ci-test"
          json.dump(opts, open("ci-data/options.json", "w"))
          EOF
          docker run -d --name lampac -p 9118:9118 -v "$PWD/ci-data:/data" lampac-addon:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9118/version >/dev/null 2>&1; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:9118/version
          echo
          # ждём, пока Lampac загрузит все модули (до этого роуты отвечают 503)
          for i in $(seq 1 60); do
            if docker logs lampac 2>&1 | grep -q "Configure complete"; then break; fi
            sleep 5
          done
          docker logs lampac 2>&1 | grep -q "Configure complete" || { echo "::error::Lampac не закончил загрузку модулей"; docker logs lampac 2>&1 | tail -200; exit 1; }
          sleep 5
          FAIL=0
          for m in Senku Anistar Animaunt AnimeFox AniTokyo Hentasis HentaiUkr AnimeMonitor; do
            if docker logs lampac 2>&1 | grep -qE "^loaded module: $m[[:space:]]*$"; then
              echo "module $m: loaded"
            else
              echo "::error::module $m не загрузился"; FAIL=1
            fi
          done
          for r in lite/senku lite/anistar lite/animaunt lite/animefox lite/anitokyo hentasis hentaiukr animemon/status; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "http://127.0.0.1:9118/$r" || true)
            echo "/$r -> $code"
            # 503 — штатный ответ модуля на запрос без title (OnError), роут жив
            case "$code" in 404|000) FAIL=1 ;; esac
          done
          if docker logs lampac 2>&1 | grep -E "error CS[0-9]+"; then FAIL=1; fi
          docker exec lampac cat /config/init.conf | jq -c '{SkipModules: .BaseModule.SkipModules, Senku, Anistar, Animaunt, AnimeFox, AniTokyo, Hentasis, HentaiUkr, Xhamster, AnimeMonitor}'
          if [ "$FAIL" = "1" ]; then
            echo "::error::Модули не загрузились, лог контейнера ниже"
            docker logs lampac 2>&1 | tail -200
            exit 1
          fi

      - name: Container log
        if: always() && steps.decide.outputs.bump == 'true'
        run: docker logs lampac 2>&1 | tail -80 || true

  bump:
    needs: build
    if: needs.build.outputs.bump == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump add-on version
        run: |
          NEW_VERSION="$(date -u +%Y.%m.%d)"
          # если сегодня уже бампали — добавляем суффикс ЧЧММ
          if grep -q "^version: \"$NEW_VERSION" lampac/config.yaml; then
            NEW_VERSION="${NEW_VERSION}.$(date -u +%H%M)"
          fi
          sed -i "s/^version: .*/version: \"$NEW_VERSION\"/" lampac/config.yaml
          # адрес репозитория для Home Assistant — всегда тот, где идёт сборка
          sed -i "s#^url: .*#url: \"https://github.com/${GITHUB_REPOSITORY}\"#" repository.yaml
          echo "${{ needs.build.outputs.digest }}" > .github/last-digest.txt
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lampac/config.yaml repository.yaml .github/last-digest.txt
          if git diff --cached --quiet; then
            echo "Нечего коммитить"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MSG="Lampac image updated -> bump add-on version to ${NEW_VERSION}"
          else
            MSG="Add-on updated -> bump add-on version to ${NEW_VERSION}"
          fi
          git commit -m "$MSG"
          git push
