name: Build and version Lampac add-on

# Единая точка, где назначается версия аддона (формат ГГГГ.ММ.ДД, при
# нескольких сборках за день — ГГГГ.ММ.ДД.ЧЧММ). Версию руками в
# lampac/config.yaml не меняем — её всегда ставит этот workflow, поэтому
# формат одинаковый во всех копиях репозитория.
#
# Когда запускается:
#   - каждый день в 05:00 UTC — если вышел новый образ Lampac на GHCR;
#   - при push в main с изменениями в lampac/ — после правок аддона/модулей;
#   - вручную (Actions → Run workflow), с опцией принудительного бампа;
#   - в pull request с изменениями в lampac/ — только сборка и smoke test, без бампа.
#
# Версия бампается только если тестовая сборка образа прошла и Lampac
# поднялся вместе с модулями из lampac/mods.

on:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches: [main]
    paths:
      - "lampac/**"
      - ".github/workflows/check-lampac-update.yml"
  pull_request:
    branches: [main]
    paths:
      - "lampac/**"
      - ".github/workflows/check-lampac-update.yml"
  workflow_dispatch:
    inputs:
      force_bump:
        description: "Поднять версию даже без изменений"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: addon-version
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      bump: ${{ steps.decide.outputs.bump }}
    steps:
      - uses: actions/checkout@v4

      - name: Get latest Lampac digest from GHCR
        id: digest
        run: |
          command -v skopeo >/dev/null || (sudo apt-get update && sudo apt-get install -y skopeo)
          DIGEST=$(skopeo inspect --no-tags docker://ghcr.io/lampac-nextgen/lampac:latest | jq -r '.Digest')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Upstream digest: $DIGEST"

      - name: Decide whether to bump
        id: decide
        run: |
          LAST=""
          [ -f .github/last-digest.txt ] && LAST="$(cat .github/last-digest.txt)"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.force_bump }}" = "true" ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          elif [ "$LAST" != "${{ steps.digest.outputs.digest }}" ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "Образ Lampac не изменился — сборка и бамп не нужны."
          fi

      - name: Build add-on image (amd64)
        if: steps.decide.outputs.bump == 'true'
        run: docker build --pull -t lampac-addon:ci lampac/

      - name: Smoke test (Lampac + модули из lampac/mods)
        if: steps.decide.outputs.bump == 'true'
        run: |
          mkdir -p ci-data
          python3 - <<'EOF'
          import json, yaml
          opts = yaml.safe_load(open("lampac/config.yaml"))["options"]
          opts["root_password"] = "ci-test"
          opts["enable_hub"] = True
          json.dump(opts, open("ci-data/options.json", "w"))
          EOF
          docker run -d --name lampac -p 9118:9118 -v "$PWD/ci-data:/data" lampac-addon:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9118/version >/dev/null 2>&1; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:9118/version
          echo
          # ждём, пока Lampac загрузит все модули (до этого роуты отвечают 503)
          for i in $(seq 1 60); do
            if docker logs lampac 2>&1 | grep -q "Configure complete"; then break; fi
            sleep 5
          done
          docker logs lampac 2>&1 | grep -q "Configure complete" || { echo "::error::Lampac не закончил загрузку модулей"; docker logs lampac 2>&1 | tail -200; exit 1; }
          sleep 5
          FAIL=0
          for m in Senku Anistar Animaunt AnimeFox AniTokyo Hentasis HentaiUkr AnimeMonitor LampacHub; do
            if docker logs lampac 2>&1 | grep -qE "^loaded module: $m[[:space:]]*$"; then
              echo "module $m: loaded"
            else
              echo "::error::module $m не загрузился"; FAIL=1
            fi
          done
          for r in lite/senku lite/anistar lite/animaunt lite/animefox lite/anitokyo hentasis hentaiukr animemon/status hub.js hub/auth hub/avatars/01-cat.svg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "http://127.0.0.1:9118/$r" || true)
            echo "/$r -> $code"
            # 503 — штатный ответ модуля на запрос без title (OnError), роут жив
            case "$code" in 404|000) FAIL=1 ;; esac
          done
          # LampacHub: админка без пароля закрыта, код входа выдаётся, база создана в /config
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:9118/hub/api/state")
          echo "/hub/api/state без пароля -> $code"; [ "$code" = "401" ] || FAIL=1
          code=$(curl -s -o /dev/null -w '%{http_code}' --cookie "accspasswd=ci-test" "http://127.0.0.1:9118/hub/api/state")
          echo "/hub/api/state с паролем -> $code"; [ "$code" = "200" ] || FAIL=1
          curl -fsS -X POST -d "name=ci" "http://127.0.0.1:9118/hub/device/code" | jq -e '.code | test("^[0-9]{6}$")' || FAIL=1
          docker exec lampac test -f /config/database/LampacHub.sql || { echo "::error::LampacHub.sql не в /config/database"; FAIL=1; }
          # LampacHub: вход устройства по коду, настройки профиля и списки
          H=http://127.0.0.1:9118
          ADM=(--cookie "accspasswd=ci-test" -H "X-Hub: 1")
          dev=$(curl -fsS -X POST -d "name=ci" "$H/hub/device/code" || echo '{}')
          code=$(echo "$dev" | jq -r '.code // empty'); key=$(echo "$dev" | jq -r '.key // empty')
          curl -fsS "${ADM[@]}" -X POST -d "code=$code&profile_id=0" "$H/hub/api/code/confirm" >/dev/null || { echo "::error::hub: подтверждение кода"; FAIL=1; }
          tok=$(curl -fsS "$H/hub/device/poll?key=$key" | jq -r '.token // empty')
          [ -n "$tok" ] || { echo "::error::hub: токен устройства не выдан"; FAIL=1; }
          curl -fsS -X POST --data-urlencode "hub_token=$tok" --data-urlencode 'data={"language":"ru","plugins":"[]"}' "$H/hub/device/settings" | jq -e '.updated > 0' >/dev/null || { echo "::error::hub: сохранение настроек"; FAIL=1; }
          curl -fsS "$H/hub/device/settings?hub_token=$tok" | jq -e '.data.language == "ru" and (.data.plugins == null)' >/dev/null || { echo "::error::hub: чтение настроек"; FAIL=1; }
          curl -fsS -X POST --data-urlencode "hub_token=$tok" --data-urlencode 'card={"id":101,"title":"CI rewatch"}' -d "category=rewatch&on=true" "$H/hub/device/lists/set" >/dev/null || { echo "::error::hub: Пересматриваю"; FAIL=1; }
          curl -fsS "$H/hub/device/lists?hub_token=$tok" | jq -e '.lists.rewatch[0].id == 101' >/dev/null || { echo "::error::hub: список Пересматриваю"; FAIL=1; }
          curl -fsS "${ADM[@]}" -X POST -H "Content-Type: application/json" \
            --data '[{"id":"202","card":{"id":202,"title":"CI look","release_date":"2020-01-01"},"categories":["look","like"]}]' \
            "$H/hub/api/lists/import?profile_id=0" | jq -e '.count == 1' >/dev/null || { echo "::error::hub: импорт JSON"; FAIL=1; }
          lists=$(curl -fsS "${ADM[@]}" "$H/hub/api/lists?profile_id=0" || echo '{}')
          echo "$lists" | jq -c '{sync, items: [.items[]? | {id, categories}]}'
          echo "$lists" | jq -e '[.items[] | select(.id == "101") | .categories[]] | index("rewatch") != null' >/dev/null || { echo "::error::hub: rewatch в админке"; FAIL=1; }
          if [ "$(echo "$lists" | jq -r '.sync')" = "true" ]; then
            echo "$lists" | jq -e '[.items[] | select(.id == "202") | .categories[]] | (index("look") != null and index("like") != null)' >/dev/null || { echo "::error::hub: импорт в базу Sync"; FAIL=1; }
            curl -fsS "${ADM[@]}" -X POST -d "profile_id=0&ids=202&add=viewed" "$H/hub/api/lists/change" >/dev/null || FAIL=1
            curl -fsS "${ADM[@]}" "$H/hub/api/lists?profile_id=0" | jq -e '[.items[] | select(.id == "202") | .categories[]] | (index("viewed") != null and index("look") == null)' >/dev/null || { echo "::error::hub: смена статуса"; FAIL=1; }
          else
            echo "::warning::database/Sync.sql нет — проверка записи в Sync пропущена"
          fi
          curl -fsS "${ADM[@]}" "$H/hub/api/lists/export" | jq -e '.format == "lampachub-lists"' >/dev/null || { echo "::error::hub: экспорт"; FAIL=1; }
          # Импорт: резервная копия Lampa (favorite строкой, как в localStorage), очередь, проверки входа
          curl -fsS "${ADM[@]}" -X POST -H "Content-Type: application/json" \
            --data '{"favorite":"{\"card\":[{\"id\":303,\"title\":\"CI backup\"}],\"scheduled\":[303],\"look\":[303],\"like\":[303]}"}' \
            "$H/hub/api/import/lampa?profile_id=0" | jq -e '.count == 1' >/dev/null || { echo "::error::hub: импорт резервной копии Lampa"; FAIL=1; }
          curl -fsS "${ADM[@]}" "$H/hub/api/import/state" | jq -e 'has("state") and has("queue")' >/dev/null || { echo "::error::hub: состояние импорта"; FAIL=1; }
          curl -fsS "${ADM[@]}" "$H/hub/api/import/queue?profile_id=0" | jq -e '.items | type == "array"' >/dev/null || { echo "::error::hub: очередь сопоставления"; FAIL=1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "${ADM[@]}" -X POST -d "profile_id=0&user=" "$H/hub/api/import/yummy")
          echo "import/yummy без ника -> $code"; [ "$code" = "400" ] || FAIL=1
          code=$(curl -s -o /dev/null -w '%{http_code}' "${ADM[@]}" -X POST -d "profile_id=0&login=" "$H/hub/api/import/aniliberty")
          echo "import/aniliberty без входа -> $code"; [ "$code" = "400" ] || FAIL=1
          code=$(curl -s -o /dev/null -w '%{http_code}' "${ADM[@]}" -X POST -d "profile_id=0&otp=true" "$H/hub/api/import/aniliberty")
          echo "import/aniliberty без кода -> $code"; [ "$code" = "400" ] || FAIL=1
          code=$(curl -s -o /dev/null -w '%{http_code}' "${ADM[@]}" -X POST -d "id=nope&kind=tv&tmdb_id=1" "$H/hub/api/import/queue/resolve")
          echo "queue/resolve чужой записи -> $code"; [ "$code" = "404" ] || FAIL=1
          code=$(curl -s -o /dev/null -w '%{http_code}' --cookie "accspasswd=ci-test" -X POST -d "profile_id=0&user=1" "$H/hub/api/import/yummy")
          echo "import/yummy без X-Hub -> $code"; [ "$code" = "403" ] || FAIL=1
          curl -sS "${ADM[@]}" "$H/hub/api/tmdb/search?q=Cowboy%20Bebop&kind=tv" | jq -e '.results | length > 0' >/dev/null || echo "::warning::hub: TMDB с раннера не ответил (это не ошибка модуля)"
          # Shikimori / MAL по нику, файлы экспорта, сведения о тайтлах
          for svc in shikimori mal; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${ADM[@]}" -X POST -d "profile_id=0&user=" "$H/hub/api/import/$svc")
            echo "import/$svc без ника -> $code"; [ "$code" = "400" ] || FAIL=1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "${ADM[@]}" -X POST -H "Content-Type: application/octet-stream" --data 'not an export' "$H/hub/api/import/file?profile_id=0")
          echo "import/file мусор -> $code"; [ "$code" = "400" ] || FAIL=1
          printf '<html><table><tr><td data-list-id="1"><h3>В Планах</h3><ul><li data-shiki-id="1" data-wa-id="1" data-id="9">Cowboy Bebop</li></ul></td></tr></table></html>' > /tmp/yummy.html
          curl -fsS "${ADM[@]}" -X POST -H "Content-Type: application/octet-stream" --data-binary @/tmp/yummy.html "$H/hub/api/import/file?profile_id=0" \
            | jq -e '.source == "yummy" and .count == 1' >/dev/null || { echo "::error::hub: импорт HTML-экспорта Yummy"; FAIL=1; }
          curl -fsS "${ADM[@]}" -X POST -d "ids=tv:1399,movie:603,bad" "$H/hub/api/titles/info" | jq -e 'has("info") and has("failed")' >/dev/null || { echo "::error::hub: titles/info"; FAIL=1; }
          curl -sS "${ADM[@]}" -X POST -d "ids=tv:1399" "$H/hub/api/titles/info" | jq -e '.info["tv:1399"].seasons > 0' >/dev/null || echo "::warning::hub: сведения TMDB о тайтле не получены (TMDB с раннера)"
          # Серверы для меню выбора в Lampa
          curl -fsS "${ADM[@]}" -X POST --data-urlencode 'data=[{"name":"Дача","url":"192.168.1.20:9118/"}]' "$H/hub/api/servers" \
            | jq -e '.servers[0].url == "http://192.168.1.20:9118"' >/dev/null || { echo "::error::hub: сохранение серверов"; FAIL=1; }
          curl -fsS "$H/hub/servers" | jq -e '.servers[0].name == "Дача"' >/dev/null || { echo "::error::hub: список серверов для Lampa"; FAIL=1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "${ADM[@]}" -X POST --data-urlencode 'data=[{"url":"::::"}]' "$H/hub/api/servers")
          echo "servers с неверным адресом -> $code"; [ "$code" = "400" ] || FAIL=1
          if docker logs lampac 2>&1 | grep -E "error CS[0-9]+"; then FAIL=1; fi
          docker exec lampac cat /config/init.conf | jq -c '{SkipModules: .BaseModule.SkipModules, Senku, Anistar, Animaunt, AnimeFox, AniTokyo, Hentasis, HentaiUkr, Xhamster, AnimeMonitor, LampacHub, customPlugins: .LampaWeb.customPlugins}'
          if [ "$FAIL" = "1" ]; then
            echo "::error::Модули не загрузились, лог контейнера ниже"
            docker logs lampac 2>&1 | tail -200
            exit 1
          fi

      - name: Container log
        if: always() && steps.decide.outputs.bump == 'true'
        run: docker logs lampac 2>&1 | tail -80 || true

  bump:
    needs: build
    if: needs.build.outputs.bump == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump add-on version
        run: |
          NEW_VERSION="$(date -u +%Y.%m.%d)"
          # если сегодня уже бампали — добавляем суффикс ЧЧММ
          if grep -q "^version: \"$NEW_VERSION" lampac/config.yaml; then
            NEW_VERSION="${NEW_VERSION}.$(date -u +%H%M)"
          fi
          sed -i "s/^version: .*/version: \"$NEW_VERSION\"/" lampac/config.yaml
          # адрес репозитория для Home Assistant — всегда тот, где идёт сборка
          sed -i "s#^url: .*#url: \"https://github.com/${GITHUB_REPOSITORY}\"#" repository.yaml
          echo "${{ needs.build.outputs.digest }}" > .github/last-digest.txt
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lampac/config.yaml repository.yaml .github/last-digest.txt
          if git diff --cached --quiet; then
            echo "Нечего коммитить"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MSG="Lampac image updated -> bump add-on version to ${NEW_VERSION}"
          else
            MSG="Add-on updated -> bump add-on version to ${NEW_VERSION}"
          fi
          git commit -m "$MSG"
          git push
