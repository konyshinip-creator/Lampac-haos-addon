configuration:
  root_password:
    name: Пароль администратора
    description: Пароль для /admin и /weblog. Если пусто — сгенерируется автоматически при первом старте (см. лог аддона).
  port:
    name: Порт
    description: TCP-порт, который слушает Lampac и к которому подключаются клиенты Lampa.
  timezone:
    name: Часовой пояс
    description: Часовой пояс внутри контейнера.
  enable_torrserver:
    name: Включить TorrServer
    description: Уже включён в апстриме по умолчанию.
  enable_jacred:
    name: Включить JacRed
    description: Уже включён в апстриме по умолчанию.
  enable_sync:
    name: Включить Sync
    description: Уже включён в апстриме по умолчанию.
  enable_timecode:
    name: Включить TimeCode
    description: Уже включён в апстриме по умолчанию.
  enable_dlna:
    name: Включить DLNA
    description: Включён в апстриме по умолчанию. Небезопасно открывать наружу без файрвола.
  enable_catalog:
    name: Включить Catalog
    description: Выключен в апстриме по умолчанию.
  enable_tracks:
    name: Включить Tracks
    description: Выключен в апстриме по умолчанию.
  enable_transcoding:
    name: Включить Transcoding
    description: Выключен в апстриме по умолчанию. Требует ресурсов CPU/GStreamer.
  enable_weblog:
    name: Включить WebLog
    description: Выключен в апстриме по умолчанию. Живой просмотр логов запросов.
  enable_cachemedia:
    name: Включить CacheMedia
    description: Выключен в апстриме по умолчанию.
  enable_proxylimiter:
    name: Включить ProxyLimiter
    description: Выключен в апстриме по умолчанию.
  enable_forkplayerxml:
    name: Включить ForkPlayerXML
    description: Выключен в апстриме по умолчанию.
  enable_msxnative:
    name: Включить MsxNative
    description: Выключен в апстриме по умолчанию.
  enable_telegramauth:
    name: Включить TelegramAuth
    description: Выключен в апстриме по умолчанию.
  enable_telegramauthbot:
    name: Включить TelegramAuthBot
    description: Выключен в апстриме по умолчанию.
  enable_potok:
    name: Включить Potok
    description: Выключен в апстриме по умолчанию.
  enable_admin_panel:
    name: Включить встроенную админку (/adminpanel/)
    description: Включает собственный веб-интерфейс Lampac на http://<IP>:9118/adminpanel/, где чекбоксами управляется полный список источников контента (70+) и модулей — без правки конфигов. Защищён паролем root_password.
  anime_providers:
    name: Аниме-провайдеры
    description: Список имён провайдеров (как в init.conf) через запятую, которые нужно явно включить, например AniLibria,AniLiberty,...
  extra_init_json:
    name: Доп. параметры init.conf (JSON)
    description: Необязательный JSON-объект, который при каждом запуске подмешивается в init.conf. Не трогайте без необходимости.
