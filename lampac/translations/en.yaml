configuration:
  root_password:
    name: Admin password
    description: Password for /admin and /weblog. Leave empty to auto-generate on first start (check the addon log).
  port:
    name: Port
    description: TCP port Lampac listens on and that Lampa clients connect to.
  timezone:
    name: Timezone
    description: Timezone used inside the container.
  enable_torrserver:
    name: Enable TorrServer
    description: Already enabled upstream by default.
  enable_jacred:
    name: Enable JacRed
    description: Already enabled upstream by default.
  enable_sync:
    name: Enable Sync
    description: Already enabled upstream by default.
  enable_timecode:
    name: Enable TimeCode
    description: Already enabled upstream by default.
  enable_dlna:
    name: Enable DLNA
    description: Enabled upstream by default. Not safe to expose publicly without a firewall.
  enable_catalog:
    name: Enable Catalog
    description: Disabled upstream by default.
  enable_tracks:
    name: Enable Tracks
    description: Disabled upstream by default.
  enable_transcoding:
    name: Enable Transcoding
    description: Disabled upstream by default. Needs GStreamer/CPU resources.
  enable_weblog:
    name: Enable WebLog
    description: Disabled upstream by default. Live request log viewer.
  enable_cachemedia:
    name: Enable CacheMedia
    description: Disabled upstream by default.
  enable_proxylimiter:
    name: Enable ProxyLimiter
    description: Disabled upstream by default.
  enable_forkplayerxml:
    name: Enable ForkPlayerXML
    description: Disabled upstream by default.
  enable_msxnative:
    name: Enable MsxNative
    description: Disabled upstream by default.
  enable_telegramauth:
    name: Enable TelegramAuth
    description: Disabled upstream by default.
  enable_telegramauthbot:
    name: Enable TelegramAuthBot
    description: Disabled upstream by default.
  enable_potok:
    name: Enable Potok
    description: Disabled upstream by default.
  enable_admin_panel:
    name: Enable built-in admin panel (/adminpanel/)
    description: Turns on Lampac's own web UI at http://<IP>:9118/adminpanel/, where you can manage the full list of content sources (70+) and modules with checkboxes, without editing config files. Protected by root_password.
  anime_providers:
    name: Anime providers
    description: Comma-separated list of anime provider names (as they appear in init.conf) to explicitly enable, e.g. AniLibria,AniLiberty,...
  extra_init_json:
    name: Advanced init.conf overrides (JSON)
    description: Optional JSON object deep-merged into init.conf on every start. Leave empty unless you know what you're doing.
