name: "Lampac"
version: "2026.09.25"
slug: "lampac"
description: >-
  Lampac Next Generation — backend-сервер для Lampa. TorrServer, JacRed, Sync
  и TimeCode включены по умолчанию (как в апстриме); дополнительно
  предвключены аниме-провайдеры AniLiberty, AniLibria, Animevost, AnimeON,
  AniMedia, MoonAnime, Mikai, AnimeLib. Остальные модули и источники можно
  включать через опции или встроенную админку /admin.
url: "https://github.com/lampac-nextgen/lampac"
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
hassio_api: false
homeassistant_api: false
host_network: false
ingress: false
panel_icon: mdi:television-play

ports:
  9118/tcp: 9118
ports_description:
  9118/tcp: "Lampac / Lampa backend API (используется клиентами Lampa напрямую)"

map:
  - app_config:rw
  - share:rw

options:
  root_password: ""
  port: 9118
  timezone: "Europe/Kiev"
  # --- базовые модули, включены по умолчанию в апстриме ---
  enable_torrserver: true
  enable_jacred: true
  enable_sync: true
  enable_timecode: true
  # --- DLNA включён по умолчанию в апстриме (base.conf), как и модули выше ---
  enable_dlna: true
  # --- базовые модули, выключены по умолчанию в апстриме (base.conf) ---
  enable_catalog: false
  enable_tracks: false
  enable_transcoding: false
  enable_weblog: false
  enable_cachemedia: false
  enable_proxylimiter: false
  enable_forkplayerxml: false
  enable_msxnative: false
  enable_telegramauth: false
  enable_telegramauthbot: false
  enable_potok: false
  # --- встроенная админка Lampac (/admin) — полный список источников
  #     контента управляется оттуда, а не из этого аддона ---
  enable_admin_panel: false
  # --- аниме-провайдеры (см. DOCS.md) ---
  anime_providers: "AniLiberty,AniLibria,Animevost,AnimeON,AniMedia,MoonAnime,Mikai,AnimeLib"
  extra_init_json: ""

schema:
  root_password: password
  port: port
  timezone: str
  enable_torrserver: bool
  enable_jacred: bool
  enable_sync: bool
  enable_timecode: bool
  enable_dlna: bool
  enable_catalog: bool
  enable_tracks: bool
  enable_transcoding: bool
  enable_weblog: bool
  enable_cachemedia: bool
  enable_proxylimiter: bool
  enable_forkplayerxml: bool
  enable_msxnative: bool
  enable_telegramauth: bool
  enable_telegramauthbot: bool
  enable_potok: bool
  enable_admin_panel: bool
  anime_providers: str
  extra_init_json: str?

webui: "http://[HOST]:[PORT:9118]/"
